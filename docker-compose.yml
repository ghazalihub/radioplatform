version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: radiology
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth_service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/radiology

  metadata-service:
    build: ./services/metadata_service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/radiology

  storage-service:
    build: ./services/storage_service
    ports:
      - "8003:8003"

  dicom-ingestion:
    build: ./services/dicom_ingestion
    ports:
      - "11112:11112"
      - "8004:8004"

  dicomweb-service:
    build: ./services/dicomweb_service
    ports:
      - "8005:8005"

  ai-service:
    build: ./services/ai_service
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0

  reporting-service:
    build: ./services/reporting_service
    ports:
      - "8006:8006"

  education-service:
    build: ./services/education_service
    ports:
      - "8009:8009"

  integration-service:
    build: ./services/integration_service
    ports:
      - "8010:8010"

  audit-service:
    build: ./services/audit_service
    ports:
      - "8011:8011"

  web-viewer:
    build: ./apps/web_viewer
    ports:
      - "3000:3000"
